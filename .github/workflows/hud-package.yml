# wesleyredhat fork only: build the HUD branch's packages exactly as Robert's release does
# (release.js build), and keep them as a workflow artifact - nothing is published.
name: HUD package

on:
  push:
    branches: [hud-support]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: build
        uses: ./.github/actions/release-build
        with:
          components: cluster-render waze-on-cluster robertn_waze_cluster
      - run: echo "built ${{ steps.build.outputs.artifacts }}"; ls -la release/out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hud-packages
          path: release/out/
