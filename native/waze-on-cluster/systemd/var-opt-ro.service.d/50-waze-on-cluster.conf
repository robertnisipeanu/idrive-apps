# waze-on-cluster boot recovery: at each head-unit shutdown, before /var/opt
# goes read-only, record whether carplay was running, failed or stopped
# (shutdown_mark.sh). A failure ("-") never holds up the shutdown.
[Service]
ExecStartPre=-/bin/sh /var/opt/waze-on-cluster/current/shutdown_mark.sh
