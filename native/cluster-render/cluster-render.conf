# cluster-render settings. Values shown are the built-in defaults; any key can
# also be given on the command line as -s key=value. The unit's own settings
# go in local_conf, which updates keep; each key there replaces the value
# here. key += a,b adds each entry a list (id8_targets,
# id8_scene_ids_allowed) does not have yet, after a comma. Unknown keys are an error, which
# here, in local_conf or on the command line stops the service (exit 2); in
# a drop-in (below) it only skips that file. "CAR-ONLY" marks values only
# the car can settle.
local_conf = /var/opt/cluster-render/cluster-render.local.conf

# --- socket -------------------------------------------------------------------
# Under systemd socket activation the socket unit owns path, mode and group
# (tm_oap_app: every OAP app may connect).
socket_path = /dev/shm/cluster-render/render.sock
socket_mode = 0660
socket_group =
# The status (targets, the drop-ins, Dcsm2's availability, subscription and
# what it sent, layers, the upload cap and why), rewritten every second, for
# diagnostics;
# `cluster-render status` prints the same.
status_path = /run/cluster-render/status.txt
# The mapping guard's strikes and disabled mappings (README.md "Mapping
# guard"): a cluster restart within 10 s of a guide hold's mapping, the
# hold giving up, or its slot refused as unknown is a strike against the
# hold, and two disable it until cluster-render's version changes or
# `cluster-render guard-reset` (as root). Other targets' strikes are only
# logged. A strike stops counting after three boots without another.
# cluster-render.service makes the folder, owned by hmi_5000, at each start.
# Empty: no guard.
guard_path = /var/opt/cluster-render/state/guard.txt

# --- generation -----------------------------------------------------------------
# Which service cluster-render starts (README.md "iDrive 8"): auto (MainApp's
# folder, else the running HMI, as mgu-store's deploy tool tells it), 7
# (cluster-render-idrive7: RAMSES 19 and Dcsm2) or 8 (cluster-render-idrive8:
# RAMSES 27 and its DCSM provider).
generation = auto

# --- log file -------------------------------------------------------------------
# Every log line is also appended here with its UTC time and level, so a
# report reaches past the journal's few minutes on the unit and across
# restarts. A line that would take the file past log_file_kb (16-16384)
# first renames it to <log_file>.1, replacing that: at most about twice
# log_file_kb on /var/opt. cluster-render.service makes the directory, owned
# by hmi_5000, at each start. Empty: no file.
log_file = /var/opt/cluster-render/log/cluster-render.log
log_file_kb = 512

# --- identity -------------------------------------------------------------------
# The identity proven on the car (README.md "Identity and packaging"):
# RAMSES participant 801 (MGUTestUserConnectingToAll), vsomeip application
# cluster-demo, DCSM clientID "\0cluster" (empty: 0x00636c7573746572;
# HmiMain3D's is 1). Only one process on the unit can hold it. On iDrive 8
# the same 801 is RAMSES 27's communication user MGUTestUser_1 (VERIFIED on
# the car with icwidget, a test provider of ours); the vsomeip and DCSM keys
# are iDrive 7's.
ramses_user = 801
vsomeip_app = cluster-demo
dcsm_client_handle =
# 1: heartbeats as requests, whose replies show they reached the KOMBI (the
# journal logs the first reply and any silence); 0: fire and forget.
dcsm_heartbeat_replies = 1
# HmiMain3D's DCSM clientID (VERIFIED: 1), sent in the unmap that takes a
# slot over from the stock HMI (<target>_take_over_stock).
dcsm_hmi_client_handle = 1

# --- targets ----------------------------------------------------------------------
# Each target is one DCSM slot with one scene, which every client's layers
# on it share. Per target: slot, content class, scene id, scene size, how
# long the slot stays mapped after the last layer stops wanting it (so one
# client replacing another never unmaps it), and whether it takes the slot
# over from the stock HMI. The map is unmapped as soon as its video has
# stopped and faded out.
#
# The KOMBI parks a map into a slot that shows other content and shows it
# when that content goes (VERIFIED on 0x100). take_over_stock = 1: while a
# contending layer wants the target and it is parked behind the stock HMI's
# content, that content is unmapped as the HMI (dcsm_hmi_client_handle), 1.5 s
# apart four times, then 10 s, then every 30 s while the HMI's map comes back
# first; the HMI maps it again behind ours, so it is shown again when ours
# goes (README.md "Arbitration").
targets = map,panel,hud
# Scene ids the KOMBI is known to take (VERIFIED on the car: 0x010004f0,
# 0x01000400, and 0x010004f1, the guide hold's, in 0x105 and 0x103;
# 0x010004f8, the panel's, reported on one car; the panel falls back from
# it).
# Others are refused at start: scene ids 7702 and 7703 made the KOMBI
# restart the cluster and the HUD. Two targets with one scene id are never
# up at once.
scene_ids_allowed = 0x010004f0,0x01000400,0x010004f1,0x010004f8
# The native central-map slot, under the gauges (VERIFIED with
# waze-on-cluster): 1088x480. Class 0: the KOMBI parked class 1 even with
# the slot free (VERIFIED). It takes over from the stock map (0x01000300 in
# Map view).
map_slot = 0x100
map_content_class = 0
map_scene_id = 0x010004f0
map_size = 1088x480
map_linger_ms = 0
map_take_over_stock = 1
# The whole cluster panel, over the gauges and under the telltales (VERIFIED
# on the car). Its own scene id, 0x010004f8, which no stock content has, lets
# it show with the HUD (reported on one car with a layout and the HUD map).
# The KOMBI refusing it as unknown (E_DCSM_CONTENTID_UNKNOWN), or the
# mapping guard disabling it after two strikes, puts the panel on
# panel_fallback_scene_id until cluster-render restarts (disabled: at every
# start), logged. The fallback, 0x01000400, is the HUD's (and HmiMain3D's
# speech dialog's): on it, whichever of the panel and the HUD has the id
# keeps it while it is wanted, and the other waits. Empty, or the panel's
# own id: no fallback. A scene file on the panel (panel_scene_files) must
# carry the id the panel has. CAR-ONLY: the map and the panel shown at once.
panel_slot = 0x203
panel_content_class = 0
panel_scene_id = 0x010004f8
panel_fallback_scene_id = 0x01000400
panel_size = 1920x720
panel_linger_ms = 3000
panel_take_over_stock = 0
# The HUD (VERIFIED on the car with the Waze map on a G80 and a G05; its
# 800x480 size is a guess), README.md "The HUD": only slot 0x323 with scene
# 0x01000400, and never taking a slot from the stock HMI
# (hud_take_over_stock 0), BMW's HUD guidance included; any other value
# leaves the HUD out and the service runs without it. It shows with the
# panel, unless the panel has fallen back to this id. Its layers write from the
# HUD's share of the upload budget (up to half, only what they spend, the
# rest going back to the cluster; README.md "Upload budget"), its evidence
# never moves the cap, and the mapping guard disables it after two strikes.
hud_slot = 0x323
hud_content_class = 0
hud_scene_id = 0x01000400
hud_size = 800x480
hud_linger_ms = 3000
hud_take_over_stock = 0
# The stock HMI's pop-up slots a target gives way to, and how long after the
# pop-up goes it is asked for again; route guidance in them never counts, and
# a layer with yield 0 (PROTOCOL.md) keeps its target shown. The HUD's media
# and list pop-ups show in 0x322 (content 0x1000251, class 512; VERIFIED on a
# G05): the KOMBI takes the HUD map down for them, and asking for it again
# while they show pushed them from the HUD to the cluster (0x1000351 in
# 0x202). With 0x322 here the HUD map steps aside until the pop-up has gone.
# hud_yield_slots = 0x321,0x322 also gives way to its other pop-ups (calls,
# apps' pop-ups; README.md "Giving way").
hud_yield_slots = 0x322
hud_yield_ms = 1500
# Scene files (PROTOCOL.md "Scene files"): with <target>_scene_files = 1 a
# client may have the service load a RAMSES scene file as the target's whole
# scene, its own scene id the target's, and edit it live; while it is there
# the target's layers wait. Files are taken only from under /var/opt/,
# root's and writable by no one else, each with the SHA-256 the client gives.
# Any other value is 0. The RAMSES 19 backend only.
map_scene_files = 0
panel_scene_files = 0
hud_scene_files = 0

# --- guide hold (iDrive 7) ---------------------------------------------------
# guide_hold = 1: while the map is shown, and only then, the slot of the
# stock HMI's CarPlay maneuver panel (content 0x01000310, class 0: in 0x105
# on one car, in 0x103 on another, which reports 0x105 disabled; VERIFIED on
# both cars with guide_slots naming that slot) is held with an empty 16x16
# scene, so the panel is parked behind it: when the scene is parked behind
# the panel, the contents of guide_take_over shown there or mapped before
# ours are unmapped as the HMI (as the map's take-over), and the HMI maps
# them again behind ours. Any other content is never unmapped. Shown in the
# slot (0x01000314, the seat-belt-warning panel, during a warning), it
# releases the hold at once, and the hold is not asked for while it is shown
# there; only parked there (0x01000314 always is, behind the box, with a
# route; VERIFIED on the car), it is left alone. More than 3 losses within
# 60 s (our scene removed, unmapped, parked again, or released to yield, not
# to a lock; or moved, below) give the hold up until the next start (a guard
# strike when no loss was BMW's own content taking the slot or a move). The
# slot is released as soon as the map is not shown, and on stop; a slot
# reported disabled is not asked for until the slot table reports it
# available, and after a lock the hold is asked for again once the slot is
# free and the map is shown. A slot the slot table does not name is never
# asked for. A client whose layer on the map has guide_hold 0 (PROTOCOL.md)
# keeps the hold released while that layer wants the map.
# guide_slots = auto: one hold, target guide_auto, with guide_scene_id, in
# 0x105 or 0x103, no other slot ever, and auto is refused when another
# target has either. Before the box is mapped, the slot is the stock HMI's
# choice for it: 0x105 when the slot table reports it enabled (status 1 or
# 2), else 0x103 when that one is; with neither, nothing is asked for ("no
# slot: 0x105 0x103 not reported enabled"). A report with a content of
# guide_take_over mapped (shown, or parked behind ours) in the other one,
# the slot not disabled, moves the hold there, released first when it is
# held: one slot at a time, a wait on the retry ladder carried over, and
# each move counts as a loss (never a guard strike) towards the give-up.
# The box unmapped, or mapped only elsewhere, the hold keeps its slot.
# The mapping guard counts the hold as one mapping in both slots
# (guide_auto auto 0x10004f1 0): two strikes in either or both disable it.
# The `dcsm: slot ...` log lines name the box's slot. CAR-ONLY: auto itself
# (the slot it picks, VERIFIED only as guide_slots = 0x103 and 0x105).
# Or guide_slots lists hex slot ids (0x1-0xfff), separated by commas or
# spaces, each once, to pin a hold to each.
# guide_hold is 0 or 1 (any other value counts as 1); guide_take_over lists
# hex content ids the same way (0x01000314 is refused). The first slot's
# scene id is guide_scene_id (0x010004f1, VERIFIED on the car in 0x105 and
# 0x103), each next one's the next id (0x010004f2, ...), which must be
# added to scene_ids_allowed by hand. Each must be in scene_ids_allowed, be
# no other target's, and clash with no HMI content (0x01000400 is also the
# HMI's speech dialog). With any other slot, scene id, class or take-over
# value the hold stays off, the safe choice: the service runs without it
# and logs why. A change takes effect at the next start (systemctl
# restart cluster-render).
# CAR-ONLY: whether other units' KOMBI takes 0x010004f1 in the box's slot
# (the mapping guard disables a hold the KOMBI restarts on).
guide_hold = 1
guide_slots = auto
guide_scene_id = 0x010004f1
guide_content_class = 0
guide_take_over = 0x01000310

# --- iDrive 8 targets ---------------------------------------------------------------
# On iDrive 8 a target is a DCSM category of the cluster and the content
# offered in it (README.md "iDrive 8"): category, content, scene id, size
# (the cluster's canvas for that category), linger. The cluster shows an
# offered content when it wants to: the map, the HUD and the guiding panel
# by themselves, the widget once it is picked in the cluster's widget menu
# (VERIFIED on the car with these categories, contents, sizes and scene ids;
# the guiding panel's content and scene id CAR-ONLY, below). There is no
# take-over. Content ids of the head unit's own (43200501, 43201101,
# 43202020-43202120, ...) must never be offered: two providers of one
# content fight. VERIFIED in this section: on the car with icwidget, a test
# provider of ours making the same calls as user 801, and with this service
# run by hand.
# A target is its keys: id8_<name>_<field> is taken for any name of
# lowercase letters and digits and the fields below (category, content,
# scene_id, size, linger_ms, description, order, preview, background_id,
# layouts, focus; one left out is empty, 0). Another target goes in
# id8_targets (id8_targets += mine, in local_conf or a drop-in) and its
# scene id in id8_scene_ids_allowed.
id8_targets = map,hud,guide,widget,popup
id8_scene_ids_allowed = 0x4d4755000108,0x4d4755000110,0x4d4755000118,0x4d4755000001,0x4d4755000002
# The middle of the cluster, between the gauges: Ca_ComCenter_IC and a
# dynamic content, 874x749, the whole canvas shown. The cluster draws its
# media placeholder over it (VERIFIED on the car).
id8_map_category = 43100201
id8_map_content = 43204041
id8_map_scene_id = 0x4d4755000108
id8_map_size = 874x749
id8_map_linger_ms = 0
# The HUD, above its speed bar: Ca_ComCenter_HUD, 353x203 (VERIFIED on the
# car).
id8_hud_category = 43100202
id8_hud_content = 43204012
id8_hud_scene_id = 0x4d4755000110
id8_hud_size = 353x203
id8_hud_linger_ms = 3000
# The guiding panel, at the top centre of the cluster over the map in the
# normal layout: Ca_GuidingPanel_IC and a dynamic content, 702x213, the
# whole canvas shown (VERIFIED on the car with the head unit's named content
# 43201101, which is never offered here). Shown with this dynamic content:
# CAR-ONLY. During route guidance the head unit offers its own guiding panel
# (43201101) in the same category; which one the cluster shows then:
# CAR-ONLY.
id8_guide_category = 43100401
id8_guide_content = 43204051
id8_guide_scene_id = 0x4d4755000118
id8_guide_size = 702x213
id8_guide_linger_ms = 3000
# A widget in the cluster's widget menu: Ca_Widget_IC and a dynamic widget
# (43202001-43205000). Its canvas is 2240x896; what shows of it is the safe
# rect the cluster gives, in canvas coordinates, which moves with the
# cluster's layout (VERIFIED on the car: 630x570@805,125 in layout 4,
# 612x527@814,170 in layout 5; the journal logs each). The menu entry: its
# text, its order, and a PNG picture (empty: none; the menu lists it
# without one, VERIFIED on the car).
id8_widget_category = 43100301
id8_widget_content = 43204001
id8_widget_scene_id = 0x4d4755000001
id8_widget_size = 2240x896
id8_widget_linger_ms = 3000
id8_widget_description = Cluster renderer
id8_widget_order = 50
id8_widget_preview =
# A widget's background, the cluster views it is shown in, and whether it
# asks to be shown (VERIFIED on the car, an M4 in its ROAD view, with
# icwidget making the same calls): background_id 43400001, 43400004,
# 43400005 or 43400006 makes the cluster black out its own artwork in the
# middle behind the widget (the gauges stay; 43400002 and 43400003 changed
# nothing visible); layouts is a mask of the cluster's views (1: the ROAD
# view; a mask without the view shown makes the cluster take the widget
# away at once; empty: every view); focus 1 asks the cluster to show the
# widget, and it switches to it by itself, nobody picks it, within about
# 0.5 s. Empty background_id and layouts: not sent.
id8_widget_background_id =
id8_widget_layouts =
id8_widget_focus = 0
# The pop-up: a second widget, which the cluster shows by itself while a
# client draws on it (focus 1) on a black middle (background 43400005); its
# menu entry lists it too. The part of its canvas a big picture fits best:
# 1140x480 at 550,220 in the ROAD view, centred on the cluster, its sides
# faded behind the gauges (VERIFIED on the car with icwidget). This target,
# content and scene id: shown by itself 0.44 s after the offer, and the
# picked widget shown again once its offer goes (VERIFIED on the car with
# this service run by hand).
id8_popup_category = 43100301
id8_popup_content = 43204003
id8_popup_scene_id = 0x4d4755000002
id8_popup_size = 2240x896
id8_popup_linger_ms = 3000
id8_popup_description = Pop-up
id8_popup_order = 51
id8_popup_preview =
id8_popup_background_id = 43400005
id8_popup_layouts =
id8_popup_focus = 1

# --- drop-ins (iDrive 8) -------------------------------------------------------------
# Files of settings with iDrive 8 targets of their own, read after
# local_conf and the command line, in the order of their paths: drop_ins
# lists glob patterns, separated by spaces (empty: none; a second instance
# run by hand beside the installed service takes -s drop_ins=, its contents
# would be the same). /var/opt/cluster-render/conf.d/ is the unit's own; a
# tool installed under /var/opt/<id>/current ships its widget there in
# cluster-render.d/, and it goes with the tool on uninstall. A drop-in only
# adds: its targets to id8_targets and their scene ids to
# id8_scene_ids_allowed with +=, and the id8_<name>_ keys of those targets.
# It is read only when it is a regular file (no symlink) owned by root and
# writable by no one else, at most 64 KB. Each goes onto a copy of the
# settings, kept only when the targets still load (as at start) and each
# target it adds has a content and a scene id no other target has; a file
# that fails anything (an error, an unknown key, another key set, a list
# set with =, a scene id not allowed, ...) is skipped whole, with a warning
# in the log, and the service runs without it. `cluster-render status` and
# the status file list each drop-in, loaded or skipped and why. A change
# takes effect at the service's next start (what iDrive 8 does when the
# service restarts is CAR-ONLY, README.md "iDrive 8": at the next boot).
#
# A widget in the cluster's widget menu, as a tool ships it in
# /var/opt/<id>/current/cluster-render.d/mywidget.conf: its content a
# dynamic widget (43202001-43205000) no one else offers, never the head
# unit's own (43202020-43202120); its scene id 0x4d4755...... and no other
# target's. Clients draw on it as on any target (target "mywidget"). The
# cluster lists every offered dynamic widget in its menu (two of ours at
# once VERIFIED on the car; more, CAR-ONLY).
#   id8_targets += mywidget
#   id8_scene_ids_allowed += 0x4d4755000020
#   id8_mywidget_category = 43100301
#   id8_mywidget_content = 43204020
#   id8_mywidget_scene_id = 0x4d4755000020
#   id8_mywidget_size = 2240x896
#   id8_mywidget_linger_ms = 3000
#   id8_mywidget_description = My widget
#   id8_mywidget_order = 60
#   id8_mywidget_focus = 0
drop_ins = /var/opt/cluster-render/conf.d/*.conf /var/opt/*/current/cluster-render.d/*.conf

# --- upload budget -------------------------------------------------------------------
# One budget for every client together: the link to the KOMBI carries every
# head-unit participant's scene data. The cap starts at upload_kb_per_s and
# steps down by upload_step_kb_per_s, to upload_floor_kb_per_s at the least,
# when the link shows it falls behind the writes (scenes removed, heartbeat
# replies silent, flushes refused or slow), and back up after a minute of
# healthy upload (README.md "Upload budget"). 0: no limit. On the car the
# cluster flashed black at 8000 and once removed a shown map after a minute
# averaging 5774 KB/s, so the ceiling sits below that. CAR-ONLY: the link to the iDrive 8
# cluster's own limits.
upload_kb_per_s = 5500
upload_floor_kb_per_s = 2000
upload_step_kb_per_s = 500
upload_burst_ms = 250
# A flush that takes this long counts as the link falling behind. CAR-ONLY:
# how long a flush takes on the unit while the link keeps up.
slow_flush_ms = 150

# --- render ----------------------------------------------------------------------
# The loop's tick while a target is up (four a second otherwise); it also
# wakes for each layer's next deadline.
fps = 30
# A target's video and image layers fade in over this long once it is shown,
# and out before it is released because nothing wants it (0-5000; 0: no
# fades). A slot the display takes, and a shutdown, do not fade.
fade_ms = 250
verbose = 0
