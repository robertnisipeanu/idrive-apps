# cluster-render settings. Values shown are the built-in defaults; any key can
# also be given on the command line as -s key=value. The unit's own settings
# go in local_conf, which updates keep; each key there replaces the value
# here. "CAR-ONLY" marks values only the car can settle.
local_conf = /var/opt/cluster-render/cluster-render.local.conf

# --- socket -------------------------------------------------------------------
# Under systemd socket activation the socket unit owns path, mode and group
# (tm_oap_app: every OAP app may connect).
socket_path = /dev/shm/cluster-render/render.sock
socket_mode = 0660
socket_group =
# The status (targets, Dcsm2's availability, subscription and what it sent,
# layers, the upload cap and why), rewritten every second, for diagnostics;
# `cluster-render status` prints the same.
status_path = /run/cluster-render/status.txt

# --- generation -----------------------------------------------------------------
# Which service cluster-render starts (README.md "iDrive 8"): auto (MainApp's
# folder, else the running HMI, as mgu-store's deploy tool tells it), 7
# (cluster-render-idrive7: RAMSES 19 and Dcsm2) or 8 (cluster-render-idrive8:
# RAMSES 27 and its DCSM provider).
generation = auto

# --- log file -------------------------------------------------------------------
# Every log line is also appended here with its UTC time and level, so a
# report reaches past the journal's few minutes on the unit and across
# restarts. A line that would take the file past log_file_kb (16-16384)
# first renames it to <log_file>.1, replacing that: at most about twice
# log_file_kb on /var/opt. cluster-render.service makes the directory, owned
# by hmi_5000, at each start. Empty: no file.
log_file = /var/opt/cluster-render/log/cluster-render.log
log_file_kb = 512

# --- identity -------------------------------------------------------------------
# The identity proven on the car (README.md "Identity and packaging"):
# RAMSES participant 801 (MGUTestUserConnectingToAll), vsomeip application
# cluster-demo, DCSM clientID "\0cluster" (empty: 0x00636c7573746572;
# HmiMain3D's is 1). Only one process on the unit can hold it. On iDrive 8
# the same 801 is RAMSES 27's communication user MGUTestUser_1 (VERIFIED on
# the car with icwidget, a test provider of ours); the vsomeip and DCSM keys
# are iDrive 7's.
ramses_user = 801
vsomeip_app = cluster-demo
dcsm_client_handle =
# 1: heartbeats as requests, whose replies show they reached the KOMBI (the
# journal logs the first reply and any silence); 0: fire and forget.
dcsm_heartbeat_replies = 1
# HmiMain3D's DCSM clientID (VERIFIED: 1), sent in the unmap that takes a
# slot over from the stock HMI (<target>_take_over_stock).
dcsm_hmi_client_handle = 1

# --- targets ----------------------------------------------------------------------
# Each target is one DCSM slot with one scene, which every client's layers
# on it share. Per target: slot, content class, scene id, scene size, how
# long the slot stays mapped after the last layer stops wanting it (so one
# client replacing another never unmaps it), and whether it takes the slot
# over from the stock HMI. The map is unmapped as soon as its video has
# stopped and faded out.
#
# The KOMBI parks a map into a slot that shows other content and shows it
# when that content goes (VERIFIED on 0x100). take_over_stock = 1: while a
# contending layer wants the target and it is parked behind the stock HMI's
# content, that content is unmapped as the HMI (dcsm_hmi_client_handle), at
# most every 3, then 10, then 30 s; the HMI maps it again behind ours, so it
# is shown again when ours goes (README.md "Arbitration").
targets = map,panel,hud
# Scene ids the KOMBI is known to take (VERIFIED on the car: 0x010004f0 and
# 0x01000400). Others are refused at start: scene ids 7702 and 7703 made the
# KOMBI restart the cluster and the HUD. Two targets with one scene id are
# never up at once.
scene_ids_allowed = 0x010004f0,0x01000400
# The native central-map slot, under the gauges (VERIFIED with
# waze-on-cluster): 1088x480. Class 0: the KOMBI parked class 1 even with
# the slot free (VERIFIED). It takes over from the stock map (0x01000300 in
# Map view).
map_slot = 0x100
map_content_class = 0
map_scene_id = 0x010004f0
map_size = 1088x480
map_linger_ms = 0
map_take_over_stock = 1
# The whole cluster panel, over the gauges and under the telltales (VERIFIED
# on the car). 0x01000400 is also HmiMain3D's speech dialog: the slot
# manager yields to it when the HMI holds the slot. CAR-ONLY: the map and the
# panel shown at once.
panel_slot = 0x203
panel_content_class = 0
panel_scene_id = 0x01000400
panel_size = 1920x720
panel_linger_ms = 3000
panel_take_over_stock = 0
# The HUD (VERIFIED on the car; its 800x480 size is a guess).
hud_slot = 0x323
hud_content_class = 0
hud_scene_id = 0x01000400
hud_size = 800x480
hud_linger_ms = 3000
hud_take_over_stock = 0

# --- iDrive 8 targets ---------------------------------------------------------------
# On iDrive 8 a target is a DCSM category of the cluster and the content
# offered in it (README.md "iDrive 8"): category, content, scene id, size
# (the cluster's canvas for that category), linger. The cluster shows an
# offered content when it wants to: the map and the HUD by themselves, the
# widget once it is picked in the cluster's widget menu (VERIFIED on the car
# with these categories, contents, sizes and scene ids). There is no
# take-over. Content ids of the head unit's own (43200501, 43202020-43202120,
# ...) must never be offered: two providers of one content fight. VERIFIED
# in this section: on the car with icwidget, a test provider of ours making
# the same calls as user 801, and with this service run by hand.
id8_targets = map,hud,widget
id8_scene_ids_allowed = 0x4d4755000108,0x4d4755000110,0x4d4755000001
# The middle of the cluster, between the gauges: Ca_ComCenter_IC and a
# dynamic content, 874x749, the whole canvas shown. The cluster draws its
# media placeholder over it (VERIFIED on the car).
id8_map_category = 43100201
id8_map_content = 43204041
id8_map_scene_id = 0x4d4755000108
id8_map_size = 874x749
id8_map_linger_ms = 0
# The HUD, above its speed bar: Ca_ComCenter_HUD, 353x203 (VERIFIED on the
# car).
id8_hud_category = 43100202
id8_hud_content = 43204012
id8_hud_scene_id = 0x4d4755000110
id8_hud_size = 353x203
id8_hud_linger_ms = 3000
# A widget in the cluster's widget menu: Ca_Widget_IC and a dynamic widget
# (43202001-43205000). Its canvas is 2240x896; what shows of it is the safe
# rect the cluster gives, in canvas coordinates, which moves with the
# cluster's layout (VERIFIED on the car: 630x570@805,125 in layout 4,
# 612x527@814,170 in layout 5; the journal logs each). The menu entry: its
# text, its order, and a PNG picture (empty: none; the menu lists it
# without one, VERIFIED on the car).
id8_widget_category = 43100301
id8_widget_content = 43204001
id8_widget_scene_id = 0x4d4755000001
id8_widget_size = 2240x896
id8_widget_linger_ms = 3000
id8_widget_description = Cluster renderer
id8_widget_order = 50
id8_widget_preview =

# --- upload budget -------------------------------------------------------------------
# One budget for every client together: the link to the KOMBI carries every
# head-unit participant's scene data. The cap starts at upload_kb_per_s and
# steps down by upload_step_kb_per_s, to upload_floor_kb_per_s at the least,
# when the link shows it falls behind the writes (scenes removed, heartbeat
# replies silent, flushes refused or slow), and back up after a minute of
# healthy upload (README.md "Upload budget"). 0: no limit. On the car the
# cluster flashed black at 8000 and once removed a shown map after a minute
# averaging 5774 KB/s, so the ceiling sits below that. CAR-ONLY: the link to the iDrive 8
# cluster's own limits.
upload_kb_per_s = 5500
upload_floor_kb_per_s = 2000
upload_step_kb_per_s = 500
upload_burst_ms = 250
# A flush that takes this long counts as the link falling behind. CAR-ONLY:
# how long a flush takes on the unit while the link keeps up.
slow_flush_ms = 150

# --- render ----------------------------------------------------------------------
# The loop's tick while a target is up (four a second otherwise); it also
# wakes for each layer's next deadline.
fps = 30
# A target's video and image layers fade in over this long once it is shown,
# and out before it is released because nothing wants it (0-5000; 0: no
# fades). A slot the display takes, and a shutdown, do not fade.
fade_ms = 250
verbose = 0
